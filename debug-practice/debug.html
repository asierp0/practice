<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Debugging Practice</title>
</head>
<body>
    <h1>Score Calculator</h1>

    <form id="score-form">
        <label for="earned-points">Earned points</label>
        <input id="earned-points" type="number">

        <label for="possible-points">Possible points</label>
        <input id="possible-points" type="number">

        <button type="submit">Calculate</button>
    </form>

    <p id="result-message">Enter a score.</p>

    <script src="debug.js"></script>
</body>
</html>
